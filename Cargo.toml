[package]
name = "tower-csrf-shield"
version = "0.1.0"
edition = "2021"
description = "A Tower layer implementing CSRF protection (synchronizer, double-submit, and hybrid patterns) with compile-time-checked configuration."
license = "MIT OR Apache-2.0"

# Version notes (see README.md "Verified toolchain and dependency versions"
# for the full explanation): this crate was built and tested against the
# versions below on rustc 1.75. All constraints are ordinary minimum-version
# requirements (Cargo will happily use a newer compatible patch/minor
# release) except `time`, which is pinned exactly. `time` is a *transitive*
# dependency only (pulled in via `cookie`/`tower-sessions`; this crate never
# uses it directly) — the pin exists solely because newer `time` patch
# releases require a Rust edition this crate's own MSRV target predates. If
# your toolchain is newer, you can likely delete that one line.
[dependencies]
tower = "0.4.13"
tower-service = "0.3.2"
tower-sessions = { version = "0.10.2", default-features = false }
http = "1.1.0"
http-body = "1.0.0"
http-body-util = "0.1.1"
bytes = "1"
cookie = { version = "0.18.0", features = ["percent-encode"] }
time = "=0.3.36" # transitive only — see note above
hmac = "0.12.1"  # 0.13 (digest 0.11) changes trait signatures this crate relies on
sha2 = "0.10.8"  # kept in lockstep with the hmac 0.12 line
rand = "0.8.5"   # 0.9/0.10 changed the Rng/thread_rng API this crate calls
base64 = "0.21.7"
subtle = "2.6.1"
form_urlencoded = "1.2.1"
async-trait = "0.1.77"
tracing = "0.1.40"

[dev-dependencies]
tokio = { version = "1.36.0", features = ["macros", "rt-multi-thread", "time"] }
tower-sessions-memory-store = "0.10.2"
tower = { version = "0.4.13", features = ["util"] }
